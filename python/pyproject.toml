[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Only scatter engine by default (no polars, fast compile).
# To build with full anndata support: change features to ["extension-module", "full"]
features = ["extension-module"]
no-default-features = true
module-name = "anndata_rs.anndata_rs"
python-source = "."
build-dir = "build"

[project]
name = "anndata_rs"
authors = [
    {name = "Kai Zhang", email = "zhangkai33@westlake.edu.cn"}
]
maintainers = [
    {name = "Kai Zhang", email = "zhangkai33@westlake.edu.cn"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.8, <3.14"
dynamic = ["version"]

dependencies = [
    "numpy>=2, <3",
    "scipy>=1.4",
]

[project.optional-dependencies]
full = [
    'anndata >= 0.8.0, < 0.13.0',
    'hdf5plugin >= 5.0.0',
    "pandas>=2.2, <3",
    "pyarrow",
    "polars>=1.9, <1.32",
]
test = ["pytest", "hypothesis==6.72.4"]