[package]
name = "anndata-zarr"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Kai Zhang <kai@kzhang.org>"]
description = "Zarr backend for the anndata package"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kaizhang/anndata-rs"
homepage = "https://github.com/kaizhang/anndata-rs"

[dependencies]
anndata = { workspace = true }
serde_json = "1.0"
anyhow = "1.0"
ndarray = { version = "0.17", features = ["serde"] }
zarrs = { version = "0.23", features = ["ndarray", "sharding", "zstd"] }
smallvec = "1.15"

[features]
default = ["polars"]
polars = ["anndata/polars"]

[dev-dependencies]
tempfile = "3.2"
ndarray-rand = "0.16"